base_model_id: outputs/kanana-8b-guardrail-sft  # SFT 완료 체크포인트
use_4bit: true
data_path: data/synthetic/dpo_pairs.jsonl
output_dir: outputs/kanana-8b-guardrail-dpo

epochs: 1
batch_size: 1
grad_accum: 16
lr: 5.0e-5
beta: 0.1           # DPO temperature (낮을수록 reference model에 가깝게)
max_seq_length: 1024
max_prompt_length: 512
gradient_checkpointing: true

lora:
  r: 16
  alpha: 32
  dropout: 0.05
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
