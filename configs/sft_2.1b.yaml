model_id: kakaoai/kanana-nano-2.1b-instruct
use_4bit: false
data_path: data/synthetic/train.jsonl
output_dir: outputs/kanana-2.1b-guardrail-sft

epochs: 3
batch_size: 4
grad_accum: 8
lr: 2.0e-4
max_seq_length: 1024

lora:
  r: 16
  alpha: 32
  dropout: 0.05
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
