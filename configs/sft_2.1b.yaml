# Kanana-2.1B (nano) SFT — A10G 24GB (ml.g5.2xlarge) 최적화
#
# VRAM 사용량 추산 (A10G 24GB):
#   기본 모델 가중치 (bfloat16): 2.1B × 2 bytes ≈  4.2 GB
#   그래디언트       (bfloat16):                 ≈  4.2 GB
#   옵티마이저 상태 (LoRA만):   AdamW × 2        ≈  0.2 GB
#   활성화 값       (ckpt OFF): batch=8, seq=1024 ≈  9.0 GB
#   기타                                          ≈  1.0 GB
#   ────────────────────────────────────────────────────────
#   합계                                         ≈ 18.6 GB  (여유 5.4 GB)
#
# 2.1B는 24GB에서 4bit 양자화 없이도 여유롭게 학습 가능

model_id: kakaocorp/kanana-nano-2.1b-instruct
use_4bit: false        # 24GB에서 full bfloat16 가능 → 수치 안정성 ↑
data_path: data/synthetic/sft_train.jsonl
output_dir: outputs/kanana-2.1b-guardrail-sft

epochs: 3
batch_size: 8          # 24GB에서 2.1B는 배치 8까지 무리 없음
grad_accum: 2          # effective batch size = 8 × 2 = 16 (8B와 동일)
lr: 2.0e-4
max_seq_length: 1024
gradient_checkpointing: false  # 2.1B는 VRAM 여유로 불필요 → 속도 15% 이득

lora:
  r: 16
  alpha: 32
  dropout: 0.05
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
