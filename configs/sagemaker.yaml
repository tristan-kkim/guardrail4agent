# AWS SageMaker Training Job 설정
#
# ── 필수 설정 (아래 2개 항목 수정 후 실행) ──────────────────────────────
#
# 1. IAM Role: SageMaker 실행 역할 ARN
#    생성 방법: AWS Console → IAM → 역할 → 역할 생성
#              신뢰할 수 있는 엔터티: SageMaker
#              권한: AmazonSageMakerFullAccess + AmazonS3FullAccess
role_arn: arn:aws:iam::889947798193:role/service-role/AmazonSageMakerAdminIAMExecutionRole
#
# 2. S3 버킷: 학습 데이터/모델 저장용
#    미입력 시 train_sagemaker.py가 자동으로 생성합니다.
# s3_bucket: my-guardrail-bucket
#
# ────────────────────────────────────────────────────────────────────────

region: ap-northeast-2

# ── 인스턴스 설정 ────────────────────────────────────────────────────────
#
#   ml.g5.2xlarge  : A10G 24GB  $1.21/hr  ← 기본값 (가성비 최고)
#     - 8B QLoRA (4bit): 학습 ~5시간, 비용 ~$6
#     - 2.1B full:       학습 ~30분, 비용 ~$0.6
#
#   ml.p3.2xlarge  : V100 16GB  $3.83/hr  (Flash Attn2 미지원)
#   ml.g5.12xlarge : A10G×4 96GB $5.67/hr  (멀티-GPU)
#   ml.p4d.24xlarge: A100×8 320GB $32.77/hr (풀 파인튜닝)

instance_type: ml.g5.2xlarge
instance_count: 1
volume_gb: 100
max_runtime_seconds: 28800  # 8시간
