model_id: kakaoai/kanana-1.5-8b-instruct
use_4bit: true
data_path: data/synthetic/train.jsonl
output_dir: outputs/kanana-8b-guardrail-sft

epochs: 3
batch_size: 1
grad_accum: 16
lr: 1.0e-4
max_seq_length: 1024

lora:
  r: 16
  alpha: 32
  dropout: 0.05
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
